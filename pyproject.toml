[project]
name = "bart-gpu-article"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "bartz",
    "ipython>=9.9.0",
    "matplotlib>=3.10.8",
    "matplotlib-label-lines>=0.8.1",
    "polars[pandas]>=1.37.1",
    "pytest>=9.0.2",
    "rpy2>=3.6.4",
    "scikit-learn>=1.8.0",
    "xgboost>=3.1.3",
]

[project.optional-dependencies]
cuda12 = ["jax[cuda12]>=0.9.0"]
cuda13 = ["jax[cuda13]>=0.9.0"]

[project.scripts]
benchmark = "bart_gpu_article.scripts.benchmark:main"
benchmark-plot = "bart_gpu_article.scripts.benchmark_plot:main"
test-rmse = "bart_gpu_article.scripts.test_rmse:main"
test-rmse-plot = "bart_gpu_article.scripts.test_rmse_plot:main"

[tool.uv.sources]
bartz = { git = "https://github.com/bartz-org/bartz.git", rev = "main" }

[tool.ruff.lint]
ignore = ["F722"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"
