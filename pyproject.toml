[project]
name = "bart-gpu-article"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "bartz",
    "catboost>=1.2.10",
    "flatbuffers>=25.12.19",
    "ipython>=9.9.0",
    "matplotlib>=3.10.8",
    "matplotlib-label-lines>=0.8.1",
    "openml>=0.15.1",
    "polars[pandas]>=1.37.1",
    "pytest>=9.0.2",
    "rapidfuzz>=3.14.3",
    "rbartpackages[jax,polars]>=0.2.0",
    "rpy2>=3.6.4",
    "scikit-learn>=1.8.0",
    "tensorstore>=0.1.82",
    "wurlitzer>=3.1.1",
    "xgboost>=3.1.3",
]

[project.optional-dependencies]
cuda12 = ["jax[cuda12]>=0.9.0", "cupy-cuda12x"]
cuda13 = ["jax[cuda13]>=0.9.0", "cupy-cuda13x"]

[project.scripts]
benchmark = "bart_gpu_article.scripts.benchmark:main"
benchmark-plot = "bart_gpu_article.scripts.benchmark_plot:main"
compare-bart-packages = "bart_gpu_article.scripts.compare_bart_packages:main"
compare-bart-packages-plot = "bart_gpu_article.scripts.compare_bart_packages_plot:main"
list-datasets = "bart_gpu_article.scripts.list_datasets:main"
savedata = "bart_gpu_article.scripts.savedata:main"
fullbench = "bart_gpu_article.scripts.fullbench:main"
fullbench-plot = "bart_gpu_article.scripts.fullbench_plot:main"
explore-datasets = "bart_gpu_article.scripts.explore_datasets:main"
save-datasets = "bart_gpu_article.scripts.save_datasets:main"

[tool.ruff.lint]
ignore = ["F722"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# cap resolutions at 1 week old so a freshly released version can't break the
# build; set here rather than in a personal uv config so that machines without
# that config resolve the same way instead of re-locking and dirtying uv.lock
exclude-newer = "1 week"

[tool.uv.sources]
bartz = { git = "https://github.com/bartz-org/bartz.git", rev = "7b3f44fbd309044d2ba669a91c78379bf9649242" }

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"
